name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "calebsons_flutter_graphql_business_operations_suite/frontend/**"
      - "calebsons_flutter_graphql_business_operations_suite/cicd/github_actions/flutter_ci.yml"
  pull_request:
    paths:
      - "calebsons_flutter_graphql_business_operations_suite/frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calebsons_flutter_graphql_business_operations_suite/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable

      - name: Generate platform folders
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
